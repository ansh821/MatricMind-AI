version: 2

models:
  - name: fct_sales
    description: >
      Central sales fact model for MetricMind.
      This model contains customer, product, geographic,
      order, sales, profit, quantity, discount and shipping data.

    columns:

      # =========================
      # DIMENSIONS
      # =========================

      - name: order_id
        description: "Unique identifier for each order."

      - name: order_date
        description: "Date when the order was placed."

      - name: ship_date
        description: "Date when the order was shipped."

      - name: customer_id
        description: "Unique identifier for the customer."

      - name: customer_name
        description: "Name of the customer."

      - name: product_id
        description: "Unique identifier for the product."

      - name: product_name
        description: "Name of the product."

      - name: category
        description: "Product category."

      - name: sub_category
        description: "Product sub-category."

      - name: segment
        description: "Customer segment."

      - name: city
        description: "City where the order was placed."

      - name: state
        description: "State where the order was placed."

      - name: country
        description: "Country where the order was placed."

      - name: region
        description: "Geographic region of the order."

      - name: market
        description: "Market associated with the order."


      # =========================
      # MEASURES
      # =========================

      - name: sales
        description: "Sales amount for the order line."

      - name: profit
        description: "Profit amount for the order line."

      - name: quantity
        description: "Quantity of products sold."

      - name: discount
        description: "Discount applied to the order line."

      - name: shipping_cost
        description: "Shipping cost associated with the order."